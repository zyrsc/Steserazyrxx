<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstatistik & Fikstür | Zeyrox League</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #020617 100%); color: white; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="antialiased overflow-x-hidden">

    <!-- Ortak Menü -->
    <nav class="glass-panel sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-full flex items-center justify-center text-xl font-bold shadow-[0_0_15px_rgba(16,185,129,0.5)]">ZL</div>
                <span class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Zeyrox League</span>
            </div>
            <div class="hidden md:flex space-x-2">
                <a href="index.html" class="text-gray-300 hover:bg-slate-800 hover:text-white px-4 py-2 rounded-md font-medium transition">Ana Sayfa</a>
                <a href="istatistik.html" class="bg-slate-800 text-white px-4 py-2 rounded-md font-medium">İstatistik & Fikstür</a>
                <a href="transfermarkt.html" class="bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-md font-medium transition flex items-center gap-2"><i class="fa-solid fa-magnifying-glass-chart"></i> Transfermarkt</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 mt-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Puan Durumu -->
        <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-2xl font-bold mb-4 border-b border-slate-700 pb-2 text-emerald-400"><i class="fa-solid fa-list-ol mr-2"></i> Puan Durumu</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-700">
                            <th class="py-2">#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th class="text-emerald-400">P</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-slate-700/50">
                            <td class="py-3 text-emerald-400 font-bold">1</td><td class="font-bold flex items-center gap-2"><img src="https://ui-avatars.com/api/?name=ARS&background=dc2626&color=fff&rounded=true&size=24"> Arsenal</td><td>10</td><td>8</td><td>1</td><td>1</td><td>+15</td><td class="font-bold text-white">25</td>
                        </tr>
                        <tr class="border-b border-slate-700/50">
                            <td class="py-3 text-blue-400 font-bold">2</td><td class="font-bold flex items-center gap-2"><img src="https://ui-avatars.com/api/?name=MIL&background=ea580c&color=fff&rounded=true&size=24"> Milan</td><td>10</td><td>7</td><td>2</td><td>1</td><td>+12</td><td class="font-bold text-white">23</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Fikstür -->
        <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-2xl font-bold mb-4 border-b border-slate-700 pb-2 text-blue-400"><i class="fa-regular fa-calendar-days mr-2"></i> 11. Hafta Fikstürü</h2>
            <div class="space-y-3">
                <div class="bg-slate-800/60 p-3 rounded-xl flex items-center justify-between border-l-4 border-emerald-500">
                    <span class="font-bold w-1/3 text-right">Dortmund</span>
                    <span class="bg-slate-900 px-4 py-1 rounded-lg font-bold border border-slate-600">2 - 1</span>
                    <span class="font-bold w-1/3">Paris</span>
                </div>
                <div class="bg-slate-800/60 p-3 rounded-xl flex items-center justify-between border-l-4 border-slate-600">
                    <span class="font-bold text-slate-400 w-1/3 text-right">Barcelona</span>
                    <span class="bg-slate-900 px-4 py-1 rounded-lg font-bold text-slate-400 border border-slate-700">21:00</span>
                    <span class="font-bold text-slate-400 w-1/3">Manchester Utd.</span>
                </div>
            </div>
        </div>

        <!-- Krallıklar -->
        <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-2xl font-bold mb-4 border-b border-slate-700 pb-2 text-yellow-400"><i class="fa-solid fa-futbol mr-2"></i> Gol Krallığı</h2>
            <div class="flex justify-between items-center bg-slate-800/50 p-3 rounded-lg border-l-4 border-yellow-400">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-slate-400">1</span>
                    <img src="https://ui-avatars.com/api/?name=AG&background=random&color=fff&rounded=true&size=30">
                    <div><p class="font-bold text-sm">Arda G.</p><p class="text-xs text-slate-400">Dortmund</p></div>
                </div>
                <span class="font-black text-lg">21</span>
            </div>
        </div>

        <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-2xl font-bold mb-4 border-b border-slate-700 pb-2 text-emerald-400"><i class="fa-solid fa-handshake mr-2"></i> Asist Krallığı</h2>
            <div class="flex justify-between items-center bg-slate-800/50 p-3 rounded-lg border-l-4 border-emerald-400">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-slate-400">1</span>
                    <img src="https://ui-avatars.com/api/?name=HK&background=random&color=fff&rounded=true&size=30">
                    <div><p class="font-bold text-sm">Hakan K.</p><p class="text-xs text-slate-400">Milan</p></div>
                </div>
                <span class="font-black text-lg">14</span>
            </div>
        </div>
    </main>
</body>
</html>
