<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeyrox League | Transfermarkt & Scouting</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Rajdhani', 'sans-serif'] },
                    colors: { zeyrox: { dark: '#050B14', card: '#0A1325', neon: '#00FFA3', border: '#1A2A42' } }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #050B14; color: #E2E8F0; }
        .glass { background: rgba(10, 19, 37, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease-in-out; backdrop-filter: blur(10px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
    </style>
</head>
<body class="antialiased">

    <!-- Navigasyon -->
    <nav class="glass sticky top-0 z-40 border-b border-zeyrox-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-zeyrox-neon rounded flex items-center justify-center">
                        <i class="fa-solid fa-server text-zeyrox-dark text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-display text-2xl font-bold">TRANSFERMARKT<span class="text-zeyrox-neon">HUB</span></h1>
                        <p class="text-xs text-gray-400 font-mono">SCOUTING VERİTABANI</p>
                    </div>
                </div>
                <div class="flex space-x-1 overflow-x-auto py-2">
                    <a href="index.html" class="px-4 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white">Dashboard</a>
                    <a href="lig.html" class="px-4 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white">Puan & İstatistik</a>
                    <a href="index.html#clubs" class="px-4 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white">Kulüpler</a>
                    <a href="transfermarkt.html" class="px-4 py-2 rounded-lg font-semibold text-sm bg-zeyrox-neon text-zeyrox-dark">Transfermarkt</a>
                    <a href="index.html#kap" class="px-4 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white">K.A.P Terminali</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 mt-4">
        <div class="glass rounded-2xl border border-zeyrox-border flex flex-col min-h-[75vh]">
            <!-- Arama Barı -->
            <div class="p-6 border-b border-zeyrox-border flex flex-col md:flex-row gap-4 justify-between items-center">
                <h2 class="text-2xl font-display font-bold flex items-center gap-2">
                    <i class="fa-solid fa-users text-zeyrox-neon"></i> Oyuncu Arama & Filtreleme
                </h2>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Oyuncu veya Takım ara..." class="w-full md:w-64 bg-zeyrox-card border border-zeyrox-border rounded-lg px-4 py-2 text-sm focus:outline-none text-white">
            </div>

            <!-- Tablo -->
            <div class="flex-1 overflow-y-auto p-4">
                <table class="w-full text-left" id="playerTable">
                    <thead>
                        <tr class="text-gray-400 text-xs uppercase border-b border-zeyrox-border">
                            <th class="p-3">Oyuncu</th>
                            <th class="p-3 text-center">Mevki</th>
                            <th class="p-3">Kulüp</th>
                            <th class="p-3 text-center">OVR</th>
                            <th class="p-3 text-right">Piyasa Değeri</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-zeyrox-border/50 text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const players = [
            { name: "Yaz Yıldırım", pos: "OOS", club: "Zeyrox FC", ovr: 94, value: "€75.000.000" },
            { name: "Mason Greenwood", pos: "SNT", club: "Sparta RP", ovr: 88, value: "€85.000.000" },
            { name: "Lionel Messi", pos: "SĞA", club: "Inter Miami", ovr: 90, value: "€35.000.000" },
            { name: "Virgil van Dijk", pos: "STP", club: "Liverpool", ovr: 89, value: "€50.000.000" }
        ];

        window.addEventListener('load', () => {
            const tbody = document.querySelector('#playerTable tbody');
            players.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition">
                        <td class="p-3 font-bold text-white">${p.name}</td>
                        <td class="p-3 text-center"><span class="bg-gray-800 text-xs px-2 py-1 rounded">${p.pos}</span></td>
                        <td class="p-3 text-gray-300 font-mono">${p.club}</td>
                        <td class="p-3 text-center font-bold text-zeyrox-neon">${p.ovr}</td>
                        <td class="p-3 text-right font-mono font-bold text-white">${p.value}</td>
                    </tr>
                `;
            });
        });

        function filterTable() {
            let filter = document.getElementById("searchInput").value.toUpperCase();
            let tr = document.querySelectorAll("#playerTable tbody tr");
            tr.forEach(row => {
                let text = row.innerText.toUpperCase();
                row.style.display = text.indexOf(filter) > -1 ? "" : "none";
            });
        }
    </script>
</body>
</html>
