<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fikstür & Kupa | Zeyrox League</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #020617 100%); color: white; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="antialiased">

    <!-- Navigasyon Menüsü -->
    <nav class="glass-panel sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-full flex items-center justify-center text-xl font-bold shadow-[0_0_15px_rgba(16,185,129,0.5)]">ZL</div>
                <span class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Zeyrox League</span>
            </a>
            <div class="hidden md:flex space-x-1">
                <a href="index.html" class="text-gray-300 hover:bg-slate-800 hover:text-white px-4 py-2 rounded-lg font-medium transition"><i class="fa-solid fa-house mr-1"></i> Ana Sayfa</a>
                <a href="puan-durumu.html" class="text-gray-300 hover:bg-slate-800 hover:text-white px-4 py-2 rounded-lg font-medium transition"><i class="fa-solid fa-list-ol mr-1"></i> Puan Durumu</a>
                <a href="fikstur.html" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium"><i class="fa-regular fa-calendar-days mr-1"></i> Fikstür</a>
                <a href="kralliklar.html" class="text-gray-300 hover:bg-slate-800 hover:text-white px-4 py-2 rounded-lg font-medium transition"><i class="fa-solid fa-trophy mr-1"></i> Krallıklar</a>
                <a href="transfermarkt.html" class="bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-lg font-medium transition flex items-center gap-2"><i class="fa-solid fa-magnifying-glass-chart"></i> Transfermarkt</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 mt-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Lig Fikstürü -->
        <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-2xl font-bold mb-6 border-b border-slate-700 pb-3 flex justify-between items-center">
                <span><i class="fa-regular fa-calendar-days mr-2 text-blue-400"></i> Lig Fikstürü</span>
                <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300">11. Hafta</span>
            </h2>
            <div class="space-y-4">
                <div class="bg-slate-800/60 p-4 rounded-xl flex items-center justify-between border-l-4 border-emerald-500">
                    <span class="font-bold w-1/3 text-right">Dortmund</span>
                    <span class="px-4 py-1 bg-slate-900 rounded-lg font-bold border border-slate-600">2 - 1</span>
                    <span class="font-bold w-1/3">Paris</span>
                </div>
                <div class="bg-slate-800/60 p-4 rounded-xl flex items-center justify-between border-l-4 border-slate-600">
                    <span class="font-bold text-slate-400 w-1/3 text-right">Barcelona</span>
                    <span class="px-4 py-1 bg-slate-900 rounded-lg font-bold text-slate-400 border border-slate-700">21:00</span>
                    <span class="font-bold text-slate-400 w-1/3">Manchester Utd.</span>
                </div>
            </div>
        </div>

        <!-- Zeyrox Süper Kupa -->
        <div class="glass-panel p-6 rounded-2xl bg-gradient-to-b from-slate-900 to-indigo-950">
            <h2 class="text-2xl font-bold mb-6 border-b border-slate-700 pb-3 text-center text-yellow-400">
                <i class="fa-solid fa-trophy mr-2"></i> Zeyrox Süper Kupa
            </h2>
            <div class="flex justify-center items-center h-64">
                <div class="flex gap-8">
                    <div class="flex flex-col justify-around gap-8">
                        <div class="bg-slate-800 px-4 py-2 rounded border border-slate-600 text-sm">
                            <div class="flex justify-between w-28 font-bold border-b border-slate-600 pb-1"><span>Milan</span><span class="text-emerald-400">2</span></div>
                            <div class="flex justify-between w-28 text-slate-400 pt-1"><span>Arsenal</span><span>0</span></div>
                        </div>
                        <div class="bg-slate-800 px-4 py-2 rounded border border-slate-600 text-sm">
                            <div class="flex justify-between w-28 font-bold border-b border-slate-600 pb-1"><span>Dortmund</span><span class="text-emerald-400">3</span></div>
                            <div class="flex justify-between w-28 text-slate-400 pt-1"><span>Paris</span><span>1</span></div>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <div class="bg-gradient-to-r from-yellow-600 to-yellow-800 px-4 py-3 rounded-lg border border-yellow-500 text-sm">
                            <div class="text-[10px] text-center text-yellow-300 font-bold uppercase mb-1">Büyük Final</div>
                            <div class="flex justify-between w-32 font-black border-b border-yellow-600 pb-1"><span>Milan</span><span>?</span></div>
                            <div class="flex justify-between w-32 font-black pt-1"><span>Dortmund</span><span>?</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
