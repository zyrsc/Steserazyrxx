<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krallıklar | Zeyrox League</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #020617 100%); color: white; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .tab-box { display: none; }
        .tab-box.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="antialiased">

    <nav class="glass-panel sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-20">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-full flex items-center justify-center text-xl font-bold">ZL</div>
                <span class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Zeyrox League</span>
            </a>
            <div class="hidden md:flex space-x-1">
                <a href="index.html" class="text-gray-300 hover:bg-slate-800 px-4 py-2 rounded-lg font-medium">Ana Sayfa</a>
                <a href="puan-durumu.html" class="text-gray-300 hover:bg-slate-800 px-4 py-2 rounded-lg font-medium">Puan Durumu</a>
                <a href="fikstur.html" class="text-gray-300 hover:bg-slate-800 px-4 py-2 rounded-lg font-medium">Fikstür</a>
                <a href="kralliklar.html" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium">Krallıklar</a>
                <a href="transfermarkt.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium">Transfermarkt</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 mt-6">
        <div class="flex justify-center gap-4 mb-8">
            <button id="btn-gol" onclick="switchKrallik('gol')" class="bg-yellow-500 text-slate-900 font-extrabold px-6 py-3 rounded-xl shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-futbol text-xl"></i> Gol Krallığı
            </button>
            <button id="btn-asist" onclick="switchKrallik('asist')" class="bg-slate-800 text-slate-300 font-extrabold px-6 py-3 rounded-xl shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-handshake text-xl"></i> Asist Krallığı
            </button>
        </div>

        <!-- Gol Krallığı Tablosu -->
        <div id="tab-gol" class="tab-box active glass-panel p-6 rounded-2xl border-l-4 border-yellow-400">
            <h2 class="text-2xl font-bold mb-6 text-yellow-400 border-b border-slate-700 pb-3 flex items-center justify-between">
                <span><i class="fa-solid fa-crown mr-2"></i> Gol Krallığı</span>
            </h2>
            <div id="gol-listesi" class="space-y-3">
                <p class="text-slate-400">Veriler yükleniyor...</p>
            </div>
        </div>

        <!-- Asist Krallığı Tablosu -->
        <div id="tab-asist" class="tab-box glass-panel p-6 rounded-2xl border-l-4 border-emerald-400">
            <h2 class="text-2xl font-bold mb-6 text-emerald-400 border-b border-slate-700 pb-3 flex items-center justify-between">
                <span><i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Asist Krallığı</span>
            </h2>
            <div id="asist-listesi" class="space-y-3">
                <p class="text-slate-400">Veriler yükleniyor...</p>
            </div>
        </div>
    </main>

    <script>
        // DATA.JSON DOSYASINDAN OTOMATİK VERİ ÇEKEN JAVASCRIPT KODU
        async function verileriYukle() {
            try {
                const res = await fetch('data.json');
                const data = await res.json();
                const oyuncular = Object.values(data.oyuncular || {});

                // 1. Gol Krallığı Sıralaması (En çok golden en aza)
                const golSirali = [...oyuncular].sort((a, b) => b.gol - a.gol);
                const golContainer = document.getElementById('gol-listesi');
                golContainer.innerHTML = '';

                golSirali.forEach((p, idx) => {
                    golContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-800/60 p-4 rounded-xl">
                            <div class="flex items-center gap-4">
                                <span class="text-xl font-bold ${idx === 0 ? 'text-yellow-400' : 'text-slate-300'}">#${idx + 1}</span>
                                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.isim)}&background=random&color=fff&rounded=true&size=40">
                                <div><p class="font-bold text-base">${p.isim}</p><p class="text-xs text-slate-400">${p.takim} • ${p.mevki}</p></div>
                            </div>
                            <span class="font-black text-2xl text-yellow-400">${p.gol} <span class="text-xs text-slate-400">Gol</span></span>
                        </div>
                    `;
                });

                // 2. Asist Krallığı Sıralaması (En çok asistten en aza)
                const asistSirali = [...oyuncular].sort((a, b) => b.asist - a.asist);
                const asistContainer = document.getElementById('asist-listesi');
                asistContainer.innerHTML = '';

                asistSirali.forEach((p, idx) => {
                    asistContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-800/60 p-4 rounded-xl">
                            <div class="flex items-center gap-4">
                                <span class="text-xl font-bold ${idx === 0 ? 'text-emerald-400' : 'text-slate-300'}">#${idx + 1}</span>
                                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.isim)}&background=random&color=fff&rounded=true&size=40">
                                <div><p class="font-bold text-base">${p.isim}</p><p class="text-xs text-slate-400">${p.takim} • ${p.mevki}</p></div>
                            </div>
                            <span class="font-black text-2xl text-emerald-400">${p.asist} <span class="text-xs text-slate-400">Asist</span></span>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Veriler alınırken hata oluştu:", err);
            }
        }

        function switchKrallik(type) {
            document.querySelectorAll('.tab-box').forEach(el => el.classList.remove('active'));
            if(type === 'gol') {
                document.getElementById('tab-gol').classList.add('active');
            } else {
                document.getElementById('tab-asist').classList.add('active');
            }
        }

        // Sayfa yüklendiğinde verileri çek
        verileriYukle();
    </script>
</body>
</html>
